<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#1E2823',
          surface: '#26332C',
          surfaceRaised: '#2E3D35',
          paper: '#F3EFE4',
          muted: '#93A69B',
          gold: '#D9A544',
          record: '#D8483F'
        },
        fontFamily: {
          serif: ['Fraunces', 'serif'],
          sans: ['Inter', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
  @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.75); } }
  .pulse-dot { animation: pulse-dot 1.2s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.8s linear infinite; }
</style>
</head>
<body class="bg-ink text-paper font-sans min-h-screen">
<div class="max-w-xl mx-auto px-6 py-14" id="app">
  <p class="text-muted text-sm">Loading…</p>
</div>

<script>
const state = {
  phase: 'loading', // loading | idle | recording | transcribing | feedbacking | done | feedback-error | no-speech | limit-reached | mic-denied | error | unsupported
  question: null,
  transcript: '',
  aiFeedbackRaw: '',
  submissions: [],
  todayCount: 0,
  dailyLimit: 3,
  recordingSeconds: 0,
  errorMessage: ''
};

let mediaRecorder = null;
let audioChunks = [];
let micStream = null;
let timerHandle = null;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

function formatDate(iso) {
  const d = new Date(iso + 'Z'); // created_at is stored as UTC by SQLite
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
         d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function wordCount(text) {
  if (!text) return 0;
  return text.trim().split(/\s+/).filter(Boolean).length;
}

// Parses the structured feedback JSON saved by /api/feedback. Falls back
// to a safe empty shape (with the raw text preserved) for legacy plain-text
// entries saved before this format existed, or anything malformed —
// old sessions should never crash the page.
function parseFeedback(raw) {
  if (!raw) return { corrections: [], wordChoices: [], fillerWords: [], fluencyScore: null, raw: '' };
  try {
    const obj = JSON.parse(raw);
    if (obj && (Array.isArray(obj.corrections) || Array.isArray(obj.wordChoices))) {
      return {
        corrections: obj.corrections || [],
        wordChoices: obj.wordChoices || [],
        fillerWords: obj.fillerWords || [],
        fluencyScore: Number.isInteger(obj.fluencyScore) ? obj.fluencyScore : null,
        raw: obj.raw || ''
      };
    }
  } catch (err) { /* not JSON — legacy plain-text feedback */ }
  return { corrections: [], wordChoices: [], fillerWords: [], fluencyScore: null, raw };
}

// Builds the transcript HTML with corrections shown inline: the wrong
// phrase struck through, the fix right after it. Any correction whose
// "original" text can't be found verbatim in the transcript is skipped
// here (and surfaced separately) rather than breaking the render.
function renderInlineTranscript(transcript, corrections) {
  if (!corrections || corrections.length === 0) return escapeHtml(transcript);

  const matches = [];
  const unmatched = [];
  corrections.forEach((c) => {
    if (!c.original) return;
    const idx = transcript.indexOf(c.original);
    if (idx !== -1) {
      matches.push({ start: idx, end: idx + c.original.length, corrected: c.corrected });
    } else {
      unmatched.push(c);
    }
  });

  matches.sort((a, b) => a.start - b.start);
  const filtered = [];
  let lastEnd = -1;
  matches.forEach((m) => {
    if (m.start >= lastEnd) { filtered.push(m); lastEnd = m.end; }
  });

  let html = '';
  let cursor = 0;
  filtered.forEach((m) => {
    html += escapeHtml(transcript.slice(cursor, m.start));
    html += '<span class="line-through text-muted">' + escapeHtml(transcript.slice(m.start, m.end)) + '</span> ';
    html += '<span class="text-gold">' + escapeHtml(m.corrected) + '</span>';
    cursor = m.end;
  });
  html += escapeHtml(transcript.slice(cursor));

  html_unmatched_cache = unmatched; // stashed for the caller
  return html;
}
let html_unmatched_cache = [];

// Renders the compact stats line + word choices + any unmatched corrections
// that belong under a transcript. Shared between the "done" state and history entries.
function renderFeedbackExtras(fb, transcript) {
  let html = '';
  const statParts = [];
  if (fb.fluencyScore) statParts.push('Fluency ' + fb.fluencyScore + '/5');
  if (fb.fillerWords && fb.fillerWords.length) {
    statParts.push(fb.fillerWords.length + ' filler word' + (fb.fillerWords.length > 1 ? 's' : '') + ' (' + fb.fillerWords.join(', ') + ')');
  }
  statParts.push(wordCount(transcript) + ' words');
  html += '<div class="text-muted text-xs mt-2 mb-3">' + statParts.join(' · ') + '</div>';

  if (fb.wordChoices && fb.wordChoices.length) {
    html += '<div class="text-xs text-muted mb-1">Better word choices</div>';
    html += '<div class="bg-surface rounded-lg px-4 py-3 text-sm leading-relaxed mb-3">';
    html += fb.wordChoices.map((wc) =>
      '<div>' + escapeHtml(wc.better) + (wc.korean ? ' <span class="text-muted">(' + escapeHtml(wc.korean) + ')</span>' : '') +
      (wc.original ? ' <span class="text-muted">instead of "' + escapeHtml(wc.original) + '"</span>' : '') + '</div>'
    ).join('');
    html += '</div>';
  }

  if (html_unmatched_cache.length) {
    html += '<div class="text-xs text-muted mb-1">Also noted</div>';
    html += '<div class="text-sm text-muted mb-3">' + html_unmatched_cache.map((c) =>
      escapeHtml(c.original) + ' → ' + escapeHtml(c.corrected)
    ).join('<br>') + '</div>';
  }

  if (fb.raw) {
    html += '<div class="text-sm leading-relaxed text-muted italic mb-3">' + escapeHtml(fb.raw) + '</div>';
  }

  return html;
}

async function loadInitial() {
  try {
    const [subsRes, qRes] = await Promise.all([
      fetch('/api/submissions'),
      fetch('/api/questions?next=1')
    ]);
    const subsData = await subsRes.json();
    state.submissions = subsData.submissions || [];
    state.todayCount = subsData.todayCount || 0;
    state.dailyLimit = subsData.dailyLimit || 3;

    if (qRes.ok) {
      const qData = await qRes.json();
      state.question = qData.question;
    }

    state.phase = state.todayCount >= state.dailyLimit ? 'limit-reached' : 'idle';
  } catch (err) {
    state.phase = 'error';
    state.errorMessage = "Couldn't load the page. Check your connection and refresh.";
  }
  render();
}

async function pickNewQuestion() {
  try {
    const res = await fetch('/api/questions?next=1');
    if (res.ok) {
      const data = await res.json();
      state.question = data.question;
    }
  } catch (err) { /* keep the current question if this fails */ }
  state.phase = state.todayCount >= state.dailyLimit ? 'limit-reached' : 'idle';
  state.transcript = '';
  state.aiFeedbackRaw = '';
  render();
}

function getSupportedMimeType() {
  const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  for (const c of candidates) {
    if (MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

async function startRecording() {
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    state.phase = 'unsupported';
    render();
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    state.phase = 'mic-denied';
    render();
    return;
  }

  const mimeType = getSupportedMimeType();
  mediaRecorder = new MediaRecorder(micStream, mimeType ? { mimeType } : undefined);
  audioChunks = [];
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = handleRecordingStop;
  mediaRecorder.start();

  state.phase = 'recording';
  state.recordingSeconds = 0;
  startTimer();
  render();
}

function stopRecording() {
  stopTimer();
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (micStream) {
    micStream.getTracks().forEach((t) => t.stop());
    micStream = null;
  }
}

function startTimer() {
  timerHandle = setInterval(() => {
    state.recordingSeconds += 1;
    const el = document.getElementById('rec-timer');
    if (el) el.textContent = formatTime(state.recordingSeconds);
  }, 1000);
}
function stopTimer() {
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = null;
}

async function handleRecordingStop() {
  const blob = new Blob(audioChunks, { type: (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm' });
  audioChunks = [];

  if (blob.size < 500) {
    state.phase = 'no-speech';
    render();
    return;
  }

  state.phase = 'transcribing';
  render();

  const formData = new FormData();
  formData.append('audio', blob, 'recording.webm');

  try {
    const res = await fetch('/api/transcribe', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok || !data.text) {
      state.phase = 'no-speech';
      render();
      return;
    }
    state.transcript = data.text;
    await getFeedback();
  } catch (err) {
    state.phase = 'error';
    state.errorMessage = 'Transcription failed. Please check your connection and try again.';
    render();
  }
}

async function getFeedback() {
  state.phase = 'feedbacking';
  render();
  try {
    const res = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: state.question.prompt, transcript: state.transcript })
    });
    const data = await res.json();
    state.aiFeedbackRaw = res.ok ? (data.feedback || '') : '';
  } catch (err) {
    state.aiFeedbackRaw = '';
  }
  await saveSubmission();
}

async function saveSubmission() {
  try {
    const res = await fetch('/api/submissions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        questionId: state.question.id,
        transcript: state.transcript,
        aiFeedback: state.aiFeedbackRaw
      })
    });
    const data = await res.json();

    if (res.status === 429) {
      state.todayCount = data.todayCount ?? state.todayCount;
      state.dailyLimit = data.dailyLimit ?? state.dailyLimit;
      state.phase = 'limit-reached';
      render();
      return;
    }
    if (!res.ok) {
      state.phase = 'error';
      state.errorMessage = 'Could not save your answer. Please try again.';
      render();
      return;
    }

    state.todayCount = data.todayCount;
    state.dailyLimit = data.dailyLimit;
    state.phase = state.aiFeedbackRaw ? 'done' : 'feedback-error';
    await refreshHistory();
    render();
  } catch (err) {
    state.phase = 'error';
    state.errorMessage = 'Could not save your answer. Check your connection.';
    render();
  }
}

async function refreshHistory() {
  try {
    const res = await fetch('/api/submissions');
    const data = await res.json();
    state.submissions = data.submissions || [];
  } catch (err) { /* keep showing whatever we already had */ }
}

function practiceAnother() {
  state.transcript = '';
  state.aiFeedbackRaw = '';
  pickNewQuestion();
}

function render() {
  const app = document.getElementById('app');
  let html = '';

  const questionBlock = (dim) =>
    `<div class="font-serif text-3xl sm:text-4xl leading-tight mb-9 ${dim ? 'opacity-50' : ''}">${escapeHtml(state.question ? state.question.prompt : '')}</div>`;

  const limitLine = `<p class="text-muted text-sm mt-3">${state.todayCount} of ${state.dailyLimit} questions today</p>`;

  if (state.phase === 'loading') {
    html = `<p class="text-muted text-sm">Loading…</p>`;
  } else if (state.phase === 'error') {
    html = `<div class="text-paper text-base leading-relaxed"><strong class="text-record">Something went wrong.</strong><br>${escapeHtml(state.errorMessage)}</div>
      <button class="mt-6 border border-white/15 hover:border-gold rounded-full px-6 py-3 text-sm font-medium" onclick="location.reload()">Reload</button>`;
  } else if (state.phase === 'unsupported') {
    html = questionBlock(true) +
      `<div class="text-base leading-relaxed"><strong class="text-record">Recording isn't supported in this browser.</strong><br>Please open this page in a recent version of Chrome, Edge, or Safari.</div>`;
  } else if (state.phase === 'mic-denied') {
    html = questionBlock(true) +
      `<div class="text-base leading-relaxed"><strong class="text-record">Microphone access is blocked.</strong><br>Check this site's permissions in your browser settings and allow the microphone, then try again.</div>
      <button class="mt-6 border border-white/15 hover:border-gold rounded-full px-6 py-3 text-sm font-medium" onclick="location.reload()">Try again</button>`;
  } else if (state.phase === 'limit-reached') {
    html = questionBlock(true) +
      `<div class="text-base leading-relaxed text-muted">You've used all your practice questions for today. Come back tomorrow!</div>` +
      limitLine;
  } else if (state.phase === 'idle') {
    html = questionBlock(false) +
      `<button class="text-muted text-sm underline underline-offset-2 hover:text-paper mb-8 block" onclick="pickNewQuestion()">Try a different question</button>
      <button class="inline-flex items-center gap-3 bg-gold text-ink rounded-full px-7 py-4 font-semibold hover:scale-[1.02] active:scale-[0.98] transition" onclick="startRecording()">
        <span class="w-2.5 h-2.5 rounded-full bg-current"></span>Start recording
      </button>
      <p class="text-muted text-sm mt-4 leading-relaxed">Click the button, speak your answer, then click again to finish. You'll get feedback right away.<br>"녹음하기" 버튼 클릭 > 질문에 대답 > 버튼 다시 클릭 > 1차 피드백 확인.</p>` +
      limitLine;
  } else if (state.phase === 'recording') {
    html = questionBlock(true) +
      `<div class="flex items-center gap-4">
        <button class="inline-flex items-center gap-3 bg-record text-paper rounded-full px-7 py-4 font-semibold" onclick="stopRecording()">
          <span class="w-2.5 h-2.5 rounded-full bg-current pulse-dot"></span>Stop recording
        </button>
        <span class="text-muted text-sm tabular-nums" id="rec-timer">00:00</span>
      </div>`;
  } else if (state.phase === 'transcribing' || state.phase === 'feedbacking') {
    const label = state.phase === 'transcribing' ? 'Transcribing your answer…' : 'Getting your feedback…';
    html = questionBlock(true) +
      `<div class="flex items-center gap-3 text-muted text-sm border-t border-white/10 pt-5">
        <span class="w-4 h-4 border-2 border-white/10 border-t-gold rounded-full spinner"></span>${label}
      </div>`;
  } else if (state.phase === 'no-speech') {
    html = questionBlock(true) +
      `<div class="text-base text-record">No speech was picked up. Try again, a little closer to the microphone.</div>
      <button class="mt-6 border border-white/15 hover:border-gold rounded-full px-6 py-3 text-sm font-medium" onclick="state.phase='idle'; render();">Try again</button>`;
  } else if (state.phase === 'done' || state.phase === 'feedback-error') {
    const fb = parseFeedback(state.aiFeedbackRaw);
    html = questionBlock(true) +
      `<div class="border-t border-white/10 pt-5">
        <div class="text-muted text-xs mb-2">Your answer</div>
        <div class="text-base leading-relaxed whitespace-pre-wrap">${renderInlineTranscript(state.transcript, fb.corrections)}</div>
      </div>`;
    if (state.phase === 'done') {
      html += `<div class="mt-2">` + renderFeedbackExtras(fb, state.transcript) + `</div>
      <p class="text-muted text-sm mt-2">Saved. Your teacher may add a note here too — check back later.</p>`;
    } else {
      html += `<div class="mt-6 text-record text-sm">Feedback couldn't be generated right now, but your answer was saved. Your teacher can still review it.</div>`;
    }
    html += `<button class="mt-7 border border-white/15 hover:border-gold rounded-full px-6 py-3 text-sm font-medium" onclick="practiceAnother()">Practice another question</button>` +
      limitLine;
  }

  html += historyBlock();
  app.innerHTML = html;
}

function historyBlock() {
  if (!state.submissions || state.submissions.length === 0) return '';
  let html = `<div class="mt-16 pt-8 border-t border-white/10">
    <div class="font-serif text-xl mb-6">Your past practice</div>`;

  state.submissions.forEach((s) => {
    const fb = parseFeedback(s.ai_feedback);
    const hasStructured = fb.corrections.length || fb.wordChoices.length || fb.fillerWords.length || fb.fluencyScore;
    const isTeacherReviewed = !!(s.teacher_feedback && s.teacher_feedback.trim());

    html += `<div class="py-5 border-t border-white/10 first:border-t-0 first:pt-0">
      <div class="text-muted text-xs mb-1">${formatDate(s.created_at)}</div>
      <div class="font-serif text-lg mb-2">${escapeHtml(s.question_prompt)}</div>
      <div class="text-sm leading-relaxed mb-1">${renderInlineTranscript(s.transcript, fb.corrections)}</div>`;

    if (hasStructured) {
      html += renderFeedbackExtras(fb, s.transcript);
    } else if (fb.raw) {
      html += `<div class="text-sm leading-relaxed text-muted italic mb-3">${escapeHtml(fb.raw)}</div>`;
    }

    if (isTeacherReviewed) {
      html += `<div class="text-xs text-gold mb-1">Teacher's note</div>
        <div class="text-sm leading-relaxed bg-surfaceRaised border-l-2 border-gold pl-4 py-2 rounded-r-lg whitespace-pre-wrap">${escapeHtml(s.teacher_feedback)}</div>`;
    } else {
      html += `<div class="text-xs text-muted italic">Waiting for your teacher's feedback</div>`;
    }
    html += `</div>`;
  });

  html += `</div>`;
  return html;
}

loadInitial();
</script>
</body>
</html>
