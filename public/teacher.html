<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Practice — Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#1E2823',
          surface: '#26332C',
          surfaceRaised: '#2E3D35',
          paper: '#F3EFE4',
          muted: '#93A69B',
          gold: '#D9A544',
          record: '#D8483F'
        },
        fontFamily: {
          serif: ['Fraunces', 'serif'],
          sans: ['Inter', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.8s linear infinite; }
</style>
</head>
<body class="bg-ink text-paper font-sans min-h-screen">
<div class="max-w-3xl mx-auto px-6 py-14" id="app"></div>

<script>
const state = {
  password: '',
  questions: [],
  editingQuestionId: null,
  categories: [],
  dailyLimit: 3,
  submissions: [],
  categoryBreakdown: [],
  vocabulary: [],
  loaded: false,
  authError: '',
  summary: null,
  summaryLoading: false
};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso + 'Z');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
         d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

// Compact single-row player: play button, a fixed-width scrub bar, time,
// speed buttons, and a volume icon that reveals a small slider flyout.
// Multiple can exist on the page at once — playing one pauses any other
// that's currently playing. Same component as the student page.
function renderAudioPlayer(id, audioKey) {
  const aid = 'audio-' + id;
  return `<div class="flex items-center gap-2 mb-3 mt-2 w-fit">
    <audio id="${aid}" preload="none" src="/api/audio?key=${encodeURIComponent(audioKey)}"
      ontimeupdate="updatePlayerUI('${id}')" onloadedmetadata="updatePlayerUI('${id}')"
      onended="updatePlayIcon('${id}')" class="hidden"></audio>
    <button onclick="toggleAudioPlay('${id}')" aria-label="Play"
      class="w-[21px] h-[21px] rounded-full bg-gold flex items-center justify-center shrink-0">
      <svg id="playicon-${id}" viewBox="0 0 24 24" class="w-[9px] h-[9px] fill-ink"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div onclick="scrubAudio(event,'${id}')" class="relative w-[130px] h-[3px] rounded-full bg-white/15 cursor-pointer shrink-0">
      <div id="fill-${id}" class="absolute left-0 top-0 h-full w-0 bg-gold rounded-full"></div>
    </div>
    <span id="time-${id}" class="text-[10.5px] text-muted tabular-nums whitespace-nowrap">00:00 / 00:00</span>
    <div class="flex gap-[3px] shrink-0">
      <button onclick="setAudioSpeed('${id}', 1, this)" class="w-[26px] text-center rounded-full border border-gold text-gold text-[10px] py-0.5">1x</button>
      <button onclick="setAudioSpeed('${id}', 1.5, this)" class="w-[26px] text-center rounded-full border border-white/15 text-muted text-[10px] py-0.5">1.5x</button>
      <button onclick="setAudioSpeed('${id}', 2, this)" class="w-[26px] text-center rounded-full border border-white/15 text-muted text-[10px] py-0.5">2x</button>
    </div>
    <div class="relative shrink-0">
      <button onclick="toggleVolFlyout('${id}')" aria-label="Volume"
        class="w-[22px] h-[22px] rounded-full flex items-center justify-center text-muted hover:text-paper">
        <svg viewBox="0 0 24 24" class="w-[15px] h-[15px] fill-current"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <div id="volflyout-${id}" class="hidden absolute right-0 bottom-[28px] bg-surfaceRaised border border-white/10 rounded-lg px-2 py-2">
        <input type="range" min="0" max="100" value="100" class="accent-gold w-[70px]"
          oninput="document.getElementById('${aid}').volume = this.value / 100">
      </div>
    </div>
  </div>`;
}

function toggleAudioPlay(id) {
  const audio = document.getElementById('audio-' + id);
  if (!audio) return;
  document.querySelectorAll('audio').forEach((a) => { if (a !== audio && !a.paused) a.pause(); });
  if (audio.paused) audio.play(); else audio.pause();
  updatePlayIcon(id);
}

function updatePlayIcon(id) {
  const audio = document.getElementById('audio-' + id);
  const icon = document.getElementById('playicon-' + id);
  if (!audio || !icon) return;
  icon.innerHTML = audio.paused
    ? '<path d="M8 5v14l11-7z"/>'
    : '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
}

function updatePlayerUI(id) {
  const audio = document.getElementById('audio-' + id);
  const fill = document.getElementById('fill-' + id);
  const time = document.getElementById('time-' + id);
  if (!audio || !fill || !time) return;
  const duration = isFinite(audio.duration) ? audio.duration : 0;
  fill.style.width = (duration ? (audio.currentTime / duration) * 100 : 0) + '%';
  time.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(duration);
}

function scrubAudio(e, id) {
  const audio = document.getElementById('audio-' + id);
  if (!audio || !isFinite(audio.duration)) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  audio.currentTime = ratio * audio.duration;
  updatePlayerUI(id);
}

function setAudioSpeed(id, rate, btn) {
  const audio = document.getElementById('audio-' + id);
  if (audio) audio.playbackRate = rate;
  Array.from(btn.parentElement.children).forEach((b) => {
    b.classList.toggle('border-gold', b === btn);
    b.classList.toggle('text-gold', b === btn);
    b.classList.toggle('border-white/15', b !== btn);
    b.classList.toggle('text-muted', b !== btn);
  });
}

function toggleVolFlyout(id) {
  document.querySelectorAll('[id^="volflyout-"]').forEach((el) => {
    if (el.id !== 'volflyout-' + id) el.classList.add('hidden');
  });
  document.getElementById('volflyout-' + id).classList.toggle('hidden');
}

function wordCount(text) {
  if (!text) return 0;
  return text.trim().split(/\s+/).filter(Boolean).length;
}

function parseFeedback(raw) {
  if (!raw) return { corrections: [], wordChoices: [], fillerWords: [], fluencyScore: null, raw: '' };
  try {
    const obj = JSON.parse(raw);
    if (obj && (Array.isArray(obj.corrections) || Array.isArray(obj.wordChoices))) {
      return {
        corrections: obj.corrections || [],
        wordChoices: obj.wordChoices || [],
        fillerWords: obj.fillerWords || [],
        fluencyScore: Number.isInteger(obj.fluencyScore) ? obj.fluencyScore : null,
        raw: obj.raw || ''
      };
    }
  } catch (err) { /* legacy plain-text feedback */ }
  return { corrections: [], wordChoices: [], fillerWords: [], fluencyScore: null, raw };
}

// Renders the compact stats line + word choices under a transcript.
// Deliberately keeps only fluency, word count, and word choices — no
// inline correction markup and no filler-word callout, since those made
// the original answer harder to read and word choices is where feedback
// quality is consistently highest.
function renderFeedbackExtras(fb, transcript) {
  let html = '';
  const statParts = [];
  if (fb.fluencyScore) statParts.push('Fluency ' + fb.fluencyScore + '/5');
  statParts.push(wordCount(transcript) + ' words');
  html += '<div class="text-muted text-xs mt-2 mb-3">' + statParts.join(' · ') + '</div>';

  if (fb.wordChoices && fb.wordChoices.length) {
    html += '<div class="text-xs text-muted mb-1">Better word choices</div>';
    html += '<div class="bg-surface rounded-lg px-4 py-3 text-sm leading-relaxed mb-3">';
    html += fb.wordChoices.map((wc) =>
      '<div>' + escapeHtml(wc.better) + (wc.korean ? ' <span class="text-muted">(' + escapeHtml(wc.korean) + ')</span>' : '') +
      (wc.original ? ' <span class="text-muted">instead of "' + escapeHtml(wc.original) + '"</span>' : '') + '</div>'
    ).join('');
    html += '</div>';
  }

  if (fb.raw) {
    html += '<div class="text-sm leading-relaxed text-muted italic mb-3">' + escapeHtml(fb.raw) + '</div>';
  }

  return html;
}

function authHeaders() {
  return { 'Content-Type': 'application/json', 'X-Teacher-Password': state.password };
}

async function loadAll() {
  const [qRes, sRes, subRes, vocabRes] = await Promise.all([
    fetch('/api/questions'),
    fetch('/api/settings'),
    fetch('/api/submissions'),
    fetch('/api/vocabulary')
  ]);
  const qData = await qRes.json();
  const sData = await sRes.json();
  const subData = await subRes.json();
  const vocabData = await vocabRes.json();

  state.questions = qData.questions || [];
  state.categories = sData.categories || [];
  state.dailyLimit = sData.dailyLimit || 3;
  state.submissions = subData.submissions || [];
  state.categoryBreakdown = subData.categoryBreakdown || [];
  state.vocabulary = vocabData.vocabulary || [];
  state.loaded = true;
  render();
}

function updatePassword(value) {
  state.password = value;
}

async function addQuestion() {
  const promptInput = document.getElementById('new-question-prompt');
  const categoryInput = document.getElementById('new-question-category');
  const prompt = promptInput.value.trim();
  const category = categoryInput.value.trim() || 'General';
  if (!prompt) return;

  const res = await fetch('/api/questions', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify({ prompt, category })
  });
  if (res.status === 401) { state.authError = 'Incorrect teacher password.'; render(); return; }
  state.authError = '';
  promptInput.value = '';
  await loadAll();
}

function startEditQuestion(id) {
  state.editingQuestionId = id;
  render();
}

function cancelEditQuestion() {
  state.editingQuestionId = null;
  render();
}

async function saveQuestionEdit(id) {
  const promptInput = document.getElementById('edit-prompt-' + id);
  const categoryInput = document.getElementById('edit-category-' + id);
  const prompt = promptInput.value.trim();
  const category = categoryInput.value.trim() || 'General';
  if (!prompt) return;

  const res = await fetch('/api/questions', {
    method: 'PUT',
    headers: authHeaders(),
    body: JSON.stringify({ id, prompt, category })
  });
  if (res.status === 401) { state.authError = 'Incorrect teacher password.'; render(); return; }
  state.authError = '';
  state.editingQuestionId = null;
  await loadAll();
}

async function deleteQuestion(id) {
  const res = await fetch('/api/questions?id=' + id, {
    method: 'DELETE',
    headers: { 'X-Teacher-Password': state.password }
  });
  if (res.status === 401) { state.authError = 'Incorrect teacher password.'; render(); return; }
  state.authError = '';
  await loadAll();
}

async function deleteVocabulary(id) {
  const res = await fetch('/api/vocabulary?id=' + id, {
    method: 'DELETE',
    headers: { 'X-Teacher-Password': state.password }
  });
  if (res.status === 401) { state.authError = 'Incorrect teacher password.'; render(); return; }
  state.authError = '';
  await loadAll();
}

async function saveSettings() {
  const limitInput = document.getElementById('daily-limit-input');

  const res = await fetch('/api/settings', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify({
      dailyLimit: Number(limitInput.value)
    })
  });
  if (res.status === 401) { state.authError = 'Incorrect teacher password.'; render(); return; }
  state.authError = '';
  await loadAll();
}

async function saveFeedback(id) {
  const textarea = document.getElementById('fb-' + id);
  const btn = document.getElementById('btn-' + id);
  const text = textarea.value.trim();
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const res = await fetch('/api/submissions', {
    method: 'PUT',
    headers: authHeaders(),
    body: JSON.stringify({ id, teacherFeedback: text })
  });

  if (res.status === 401) {
    state.authError = 'Incorrect teacher password.';
    btn.disabled = false;
    btn.textContent = 'Save feedback';
    render();
    return;
  }
  state.authError = '';
  await loadAll();
}

async function generateSummary() {
  state.summaryLoading = true;
  state.summary = null;
  render();

  const res = await fetch('/api/summary', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify({ days: 7 })
  });

  state.summaryLoading = false;
  if (res.status === 401) { state.authError = 'Incorrect teacher password.'; render(); return; }
  state.authError = '';
  const data = await res.json();
  state.summary = res.ok ? data : { summary: 'Could not generate a summary right now.', sessionCount: 0, avgFluency: null };
  render();
}

async function clearToday() {
  if (!confirm("This deletes today's practice sessions and resets today's count back to 0. Continue?")) return;

  const res = await fetch('/api/submissions', {
    method: 'DELETE',
    headers: { 'X-Teacher-Password': state.password }
  });
  if (res.status === 401) { state.authError = 'Incorrect teacher password.'; render(); return; }
  state.authError = '';
  await loadAll();
}

async function cleanupOldAudio() {
  if (!confirm("Delete audio recordings older than 14 days? Transcripts and feedback stay untouched. This can't be undone.")) return;

  const res = await fetch('/api/submissions?cleanupAudio=1', {
    method: 'DELETE',
    headers: { 'X-Teacher-Password': state.password }
  });
  if (res.status === 401) { state.authError = 'Incorrect teacher password.'; render(); return; }
  state.authError = '';
  const data = await res.json();
  alert((data.cleaned || 0) + ' recording(s) deleted.');
  await loadAll();
}

async function deleteSubmission(id) {
  if (!confirm('Delete this recording and its feedback? This cannot be undone.')) return;

  const res = await fetch('/api/submissions?id=' + id, {
    method: 'DELETE',
    headers: { 'X-Teacher-Password': state.password }
  });
  if (res.status === 401) { state.authError = 'Incorrect teacher password.'; render(); return; }
  state.authError = '';
  await loadAll();
}

function render() {
  const app = document.getElementById('app');

  if (!state.loaded) {
    app.innerHTML = `<p class="text-muted text-sm">Loading…</p>`;
    return;
  }

  let html = `
    <div class="font-serif text-3xl mb-1">Practice sessions</div>
    <p class="text-muted text-sm mb-8">Manage questions, set the limit, and review her answers.</p>

    <div class="mb-10">
      <label class="text-muted text-xs block mb-2">Teacher password</label>
      <input type="password" placeholder="Enter password to make changes" value="${escapeHtml(state.password)}"
        oninput="updatePassword(this.value)"
        class="w-full bg-surfaceRaised border border-white/10 focus:border-gold outline-none rounded-lg px-4 py-2.5 text-sm" />
      ${state.authError ? `<p class="text-record text-sm mt-2">${escapeHtml(state.authError)}</p>` : ''}
    </div>

    <div class="border-t border-white/10 pt-8 mb-10">
      <div class="font-serif text-xl mb-4">Weekly pattern summary</div>
      <button onclick="generateSummary()" class="bg-gold text-ink rounded-lg px-5 py-2.5 text-sm font-semibold mb-4" ${state.summaryLoading ? 'disabled' : ''}>
        ${state.summaryLoading ? 'Generating…' : 'Generate summary (last 7 days)'}
      </button>`;

  if (state.summary) {
    html += `<div class="bg-surface rounded-lg px-5 py-4 text-sm leading-relaxed mb-2">${escapeHtml(state.summary.summary)}</div>
      <div class="text-muted text-xs">${state.summary.sessionCount} session${state.summary.sessionCount === 1 ? '' : 's'}${state.summary.avgFluency ? ' · avg fluency ' + state.summary.avgFluency + '/5' : ''}</div>`;
  }

  html += `</div>

    <div class="border-t border-white/10 pt-8 mb-10">
      <div class="font-serif text-xl mb-4">Categories answered</div>`;

  if (!state.categoryBreakdown || state.categoryBreakdown.length === 0) {
    html += `<p class="text-muted text-sm">Nothing answered yet.</p>`;
  } else {
    html += `<div class="space-y-2">`;
    state.categoryBreakdown.forEach((c) => {
      html += `<div class="flex items-center gap-3">
        <span class="text-sm w-28 shrink-0 truncate">${escapeHtml(c.category)}</span>
        <div class="flex-1 h-2 bg-surfaceRaised rounded-full overflow-hidden">
          <div class="h-full bg-gold rounded-full" style="width: ${c.percent}%"></div>
        </div>
        <span class="text-muted text-xs w-16 text-right shrink-0">${c.percent}% · ${c.count}</span>
      </div>`;
    });
    html += `</div>`;
  }

  html += `</div>

    <div class="border-t border-white/10 pt-8 mb-10">
      <div class="font-serif text-xl mb-4">Question sets</div>
      <div class="flex flex-wrap gap-3 mb-4">
        <input id="new-question-prompt" type="text" placeholder="New question…"
          class="flex-1 min-w-[200px] bg-surfaceRaised border border-white/10 focus:border-gold outline-none rounded-lg px-4 py-2.5 text-sm" />
        <input id="new-question-category" type="text" placeholder="Category (e.g. Business)"
          class="w-48 bg-surfaceRaised border border-white/10 focus:border-gold outline-none rounded-lg px-4 py-2.5 text-sm" />
        <button onclick="addQuestion()" class="bg-gold text-ink rounded-lg px-5 py-2.5 text-sm font-semibold">Add</button>
      </div>
      <div class="space-y-1">`;

  const grouped = {};
  state.questions.forEach((q) => {
    grouped[q.category] = grouped[q.category] || [];
    grouped[q.category].push(q);
  });

  if (state.questions.length === 0) {
    html += `<p class="text-muted text-sm">No questions yet — add one above.</p>`;
  } else {
    Object.keys(grouped).sort().forEach((cat) => {
      html += `<div class="text-muted text-xs mt-4 mb-1">${escapeHtml(cat)}</div>`;
      grouped[cat].forEach((q) => {
        if (state.editingQuestionId === q.id) {
          html += `<div class="flex flex-wrap items-center gap-2 py-1.5 border-b border-white/5">
            <input id="edit-prompt-${q.id}" type="text" value="${escapeHtml(q.prompt)}"
              class="flex-1 min-w-[200px] bg-surfaceRaised border border-white/10 focus:border-gold outline-none rounded-lg px-3 py-1.5 text-sm" />
            <input id="edit-category-${q.id}" type="text" value="${escapeHtml(q.category)}"
              class="w-40 bg-surfaceRaised border border-white/10 focus:border-gold outline-none rounded-lg px-3 py-1.5 text-sm" />
            <button onclick="saveQuestionEdit(${q.id})" class="bg-gold text-ink rounded-lg px-4 py-1.5 text-xs font-semibold shrink-0">Save</button>
            <button onclick="cancelEditQuestion()" class="text-muted hover:text-paper text-xs shrink-0">Cancel</button>
          </div>`;
        } else {
          html += `<div class="flex items-center justify-between gap-3 py-1.5 border-b border-white/5">
            <span class="text-sm">${escapeHtml(q.prompt)}</span>
            <span class="flex items-center gap-3 shrink-0">
              <button onclick="startEditQuestion(${q.id})" class="text-muted hover:text-gold text-xs">Edit</button>
              <button onclick="deleteQuestion(${q.id})" class="text-muted hover:text-record text-xs">Delete</button>
            </span>
          </div>`;
        }
      });
    });
  }

  html += `</div></div>

    <div class="border-t border-white/10 pt-8 mb-10">
      <div class="font-serif text-xl mb-4">Settings</div>
      <p class="text-muted text-sm mb-4">Each question is drawn from a random category, so her daily questions naturally mix Daily, Business, Scenario, and whatever else you've added.</p>
      <div class="flex flex-wrap gap-4 items-end">
        <div>
          <label class="text-muted text-xs block mb-2">Daily question limit</label>
          <input id="daily-limit-input" type="number" min="1" value="${state.dailyLimit}"
            class="w-28 bg-surfaceRaised border border-white/10 focus:border-gold outline-none rounded-lg px-4 py-2.5 text-sm" />
        </div>
        <button onclick="saveSettings()" class="bg-gold text-ink rounded-lg px-5 py-2.5 text-sm font-semibold">Save settings</button>
      </div>
    </div>

    <div class="border-t border-white/10 pt-8 mb-10">
      <div class="font-serif text-xl mb-4">Reset today</div>
      <p class="text-muted text-sm mb-4">Deletes today's practice sessions and resets today's count back to 0 — handy after testing, so she opens to a clean page. Nothing before today is touched.</p>
      <button onclick="clearToday()" class="border border-record text-record hover:bg-record hover:text-paper rounded-lg px-5 py-2.5 text-sm font-semibold transition">Clear today's sessions</button>
    </div>

    <div class="border-t border-white/10 pt-8 mb-10">
      <div class="font-serif text-xl mb-4">Old recordings</div>
      <p class="text-muted text-sm mb-4">Deletes saved audio for submissions older than 14 days — her transcripts, AI feedback, and your notes for them are kept. Run this whenever you want; nothing happens on its own.</p>
      <button onclick="cleanupOldAudio()" class="border border-record text-record hover:bg-record hover:text-paper rounded-lg px-5 py-2.5 text-sm font-semibold transition">Clean up recordings older than 14 days</button>
    </div>

    <div class="border-t border-white/10 pt-8 mb-10">
      <div class="font-serif text-xl mb-4">Words she's learned</div>`;

  if (state.vocabulary.length === 0) {
    html += `<p class="text-muted text-sm">No word corrections saved yet — they'll show up here as she practices.</p>`;
  } else {
    html += `<div class="space-y-1">`;
    state.vocabulary.forEach((v) => {
      html += `<div class="flex items-center justify-between gap-3 py-1.5 border-b border-white/5">
        <span class="text-sm">${escapeHtml(v.word)}${v.korean ? ' <span class="text-muted">(' + escapeHtml(v.korean) + ')</span>' : ''}</span>
        <button onclick="deleteVocabulary(${v.id})" class="text-muted hover:text-record text-xs shrink-0">Remove</button>
      </div>`;
    });
    html += `</div>`;
  }

  html += `</div>

    <div class="border-t border-white/10 pt-8">
      <div class="font-serif text-xl mb-4">Submissions</div>`;

  if (state.submissions.length === 0) {
    html += `<p class="text-muted text-sm">No practice sessions yet. Once she records an answer, it'll show up here.</p>`;
  } else {
    state.submissions.forEach((s) => {
      const fb = parseFeedback(s.ai_feedback);
      const hasStructured = fb.corrections.length || fb.wordChoices.length || fb.fillerWords.length || fb.fluencyScore;

      html += `<div class="py-5 border-t border-white/10 first:border-t-0 first:pt-0">
        <div class="flex items-center justify-between gap-3 mb-1">
          <div class="text-muted text-xs">${formatDate(s.created_at)} · ${escapeHtml(s.question_category)}</div>
          <button onclick="deleteSubmission(${s.id})" class="text-muted hover:text-record text-xs shrink-0">Delete</button>
        </div>
        
        <div class="font-serif text-lg mb-2">${escapeHtml(s.question_prompt)}</div>
        <div class="text-sm leading-relaxed mb-1">${escapeHtml(s.transcript)}</div>`;

      if (s.audio_key) {
        html += renderAudioPlayer(s.id, s.audio_key);
      }

      if (hasStructured) {
        html += renderFeedbackExtras(fb, s.transcript);
      } else if (fb.raw) {
        html += `<div class="text-sm leading-relaxed text-muted italic mb-3">${escapeHtml(fb.raw)}</div>`;
      }

      html += `<label class="text-muted text-xs block mb-1">Your feedback ${s.teacher_feedback ? '<span class="text-gold">· saved</span>' : ''}</label>
        <textarea id="fb-${s.id}" placeholder="Write your feedback for her here…"
          class="w-full bg-surfaceRaised border border-white/10 focus:border-gold outline-none rounded-lg px-4 py-2.5 text-sm min-h-[80px] mb-2">${escapeHtml(s.teacher_feedback || '')}</textarea>
        <button id="btn-${s.id}" onclick="saveFeedback(${s.id})" class="bg-gold text-ink rounded-lg px-5 py-2 text-sm font-semibold">${s.teacher_feedback ? 'Update feedback' : 'Save feedback'}</button>
      </div>`;
    });
  }

  html += `</div>`;
  app.innerHTML = html;
}

loadAll();
</script>
</body>
</html>
