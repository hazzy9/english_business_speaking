name = 'english-business-speaking'
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "speaking-practice-db-test-v2"
database_id = "ab96cd48-b695-4c9d-9ff1-2e5fcc69b882"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "speaking-practice-audio-test"

# TEACHER_PASSWORD is read from env.TEACHER_PASSWORD at runtime.
# Do NOT put the real password here — this file is committed to git.
# Set it as a secret instead (see README.md), either via:
#   wrangler pages secret put TEACHER_PASSWORD
# or the Cloudflare dashboard: Pages project -> Settings -> Environment variables.
